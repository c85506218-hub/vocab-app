<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文單字複習</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: #1e293b;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #334155;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }
  .progress-bar-wrap {
    flex: 1;
    max-width: 300px;
    margin: 0 20px;
    background: #334155;
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar { height: 100%; background: #38bdf8; border-radius: 99px; transition: width .4s; }
  .progress-text { font-size: .75rem; color: #94a3b8; white-space: nowrap; }

  /* ── Search ── */
  .search-wrap {
    padding: 16px 24px 0;
    display: flex;
    gap: 10px;
  }
  .search-wrap input {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 16px;
    color: #e2e8f0;
    font-size: .95rem;
    outline: none;
  }
  .search-wrap input:focus { border-color: #38bdf8; }
  .search-wrap input::placeholder { color: #475569; }
  .btn-icon {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 10px 14px;
    color: #94a3b8;
    cursor: pointer;
    font-size: 1rem;
    transition: all .2s;
  }
  .btn-icon:hover { border-color: #38bdf8; color: #38bdf8; }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 16px 24px 0;
  }
  .tab {
    padding: 7px 18px;
    border-radius: 99px;
    border: 1px solid #334155;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
  }
  .tab.active { background: #38bdf8; border-color: #38bdf8; color: #0f172a; font-weight: 600; }

  /* ── Flashcard ── */
  #view-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  .card-counter { font-size: .85rem; color: #64748b; margin-bottom: 14px; }

  /* ── Single Card (no flip) ── */
  .vocab-card {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(160deg, #1a2f4a 0%, #1e293b 100%);
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 28px 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* top row: word + speak */
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .card-word {
    font-size: 2.6rem;
    font-weight: 800;
    color: #f1f5f9;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .btn-speak {
    background: rgba(56,189,248,.15);
    border: 1px solid #38bdf8;
    border-radius: 99px;
    padding: 7px 16px;
    color: #38bdf8;
    cursor: pointer;
    font-size: .9rem;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    margin-left: 12px;
    margin-top: 6px;
  }
  .btn-speak:hover { background: rgba(56,189,248,.3); }

  /* badges row */
  .card-badges {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .badge-pos {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #38bdf8;
    font-weight: 700;
  }
  .badge-level {
    font-size: .7rem;
    background: rgba(56,189,248,.15);
    color: #38bdf8;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* phonetic */
  .card-phonetic {
    font-size: 1rem;
    color: #64748b;
    font-style: italic;
    margin-bottom: 16px;
  }

  /* divider */
  .card-divider {
    border: none;
    border-top: 1px solid #1e3a5f;
    margin: 0 0 16px;
  }

  /* definition */
  .card-def {
    font-size: 1.3rem;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 14px;
    line-height: 1.4;
  }

  /* example */
  .card-example {
    background: rgba(56,189,248,.07);
    border-left: 3px solid #38bdf8;
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    font-size: .9rem;
    color: #94a3b8;
    line-height: 1.6;
  }
  .card-example em { color: #f1f5f9; font-style: normal; font-weight: 600; }
  .card-example-label {
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #475569;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .phonetic {
    font-size: 1.05rem;
    color: #94a3b8;
    font-style: italic;
    margin-bottom: 14px;
    width: 100%;
  }
  .section-label {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #475569;
    margin-bottom: 5px;
    font-weight: 600;
  }
  .definition { font-size: .95rem; color: #e2e8f0; margin-bottom: 14px; line-height: 1.5; width: 100%; }
  .example {
    background: rgba(56,189,248,.08);
    border-left: 3px solid #38bdf8;
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    font-size: .88rem;
    color: #94a3b8;
    line-height: 1.55;
    margin-bottom: 14px;
    width: 100%;
  }
  .example em { color: #f1f5f9; font-style: normal; font-weight: 600; }
  .synonyms { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .syn-tag {
    background: #1e3a2e;
    border: 1px solid #2d5a3d;
    border-radius: 99px;
    padding: 3px 12px;
    font-size: .8rem;
    color: #4ade80;
    cursor: pointer;
    transition: all .2s;
  }
  .syn-tag:hover { background: #2d5a3d; }

  /* ── Card Controls ── */
  .card-controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    width: 100%;
    max-width: 560px;
    justify-content: center;
  }
  .btn-ctrl {
    flex: 1;
    max-width: 120px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .btn-ctrl .icon { font-size: 1.2rem; }
  .btn-ctrl:hover { border-color: #38bdf8; color: #38bdf8; }
  .btn-ctrl.learned { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,.1); }
  .btn-ctrl.shuffle:hover { border-color: #f59e0b; color: #f59e0b; }

  /* ── List View ── */
  #view-list { display: none; padding: 16px 24px; }
  .list-item {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all .2s;
  }
  .list-item:hover { border-color: #38bdf8; }
  .list-item.learned-item { opacity: .5; }
  .list-top { display: flex; justify-content: space-between; align-items: center; }
  .list-word { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
  .list-phonetic { font-size: .8rem; color: #64748b; font-style: italic; }
  .list-def { font-size: .85rem; color: #94a3b8; margin-top: 5px; line-height: 1.4; }
  .list-syns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .list-pos-badge {
    font-size: .7rem;
    background: rgba(56,189,248,.15);
    color: #38bdf8;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .list-speak {
    background: transparent;
    border: none;
    color: #475569;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
    border-radius: 8px;
    transition: color .2s;
  }
  .list-speak:hover { color: #38bdf8; }
  .list-learned-dot {
    width: 8px; height: 8px;
    background: #4ade80;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Empty state ── */
  .empty { text-align: center; color: #475569; padding: 60px 24px; font-size: .95rem; }

  /* ── Toasts ── */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #334155;
    color: #e2e8f0;
    padding: 10px 22px;
    border-radius: 99px;
    font-size: .85rem;
    transition: transform .3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* speaking animation */
  @keyframes pulse-speak {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .speaking { animation: pulse-speak .5s infinite; }
</style>
</head>
<body>

<header>
  <h1>📚 單字複習</h1>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <span class="progress-text" id="progressText">0 / 0 已學會</span>
</header>

<div class="search-wrap">
  <input id="searchInput" type="text" placeholder="搜尋單字…" oninput="handleSearch()">
  <button class="btn-icon" onclick="clearSearch()" title="清除搜尋">✕</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('card')">卡片模式</button>
  <button class="tab" onclick="switchTab('list')">清單模式</button>
  <button class="tab" onclick="filterLearned(false)">未學會</button>
  <button class="tab" onclick="filterLearned(true)">已學會</button>
</div>
<div class="tabs" style="margin-top:6px">
  <button class="tab level-tab" onclick="filterLevel(null)" id="lvAll">全部</button>
  <button class="tab level-tab" onclick="filterLevel('A1')" id="lvA1">A1</button>
  <button class="tab level-tab" onclick="filterLevel('A2')" id="lvA2">A2</button>
  <button class="tab level-tab" onclick="filterLevel('B1')" id="lvB1">B1</button>
  <button class="tab level-tab" onclick="filterLevel('B2')" id="lvB2">B2</button>
  <button class="tab level-tab" onclick="filterLevel('C1')" id="lvC1">C1</button>
</div>

<!-- Card View -->
<div id="view-card">
  <div class="card-counter" id="cardCounter">1 / 2143</div>
  <div class="vocab-card" id="vocabCard">
    <div class="card-top">
      <div class="card-word" id="cardWord"></div>
      <button class="btn-speak" id="btnSpeak" onclick="speakCurrent(event)">🔊 朗讀</button>
    </div>
    <div class="card-badges">
      <span class="badge-pos" id="cardPos"></span>
      <span class="badge-level" id="cardLevel"></span>
    </div>
    <div class="card-phonetic" id="cardPhonetic"></div>
    <hr class="card-divider">
    <div class="card-def" id="cardDef"></div>
    <div id="cardExampleWrap" style="display:none">
      <div class="card-example-label">例句</div>
      <div class="card-example" id="cardExample"></div>
    </div>
  </div>

  <div class="card-controls">
    <button class="btn-ctrl" onclick="prevCard()">
      <span class="icon">◀</span>
      <span>上一個</span>
    </button>
    <button class="btn-ctrl" id="btnLearned" onclick="toggleLearned()">
      <span class="icon" id="learnedIcon">★</span>
      <span id="learnedLabel">標記學會</span>
    </button>
    <button class="btn-ctrl shuffle" onclick="shuffleCards()">
      <span class="icon">⇄</span>
      <span>隨機</span>
    </button>
    <button class="btn-ctrl" onclick="nextCard()">
      <span class="icon">▶</span>
      <span>下一個</span>
    </button>
  </div>
</div>

<!-- List View -->
<div id="view-list"></div>

<div id="toast"></div>

<script>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let filteredWords = [...allWords];
let currentIndex = 0;
let learnedSet = new Set(JSON.parse(localStorage.getItem('learnedWords') || '[]'));
let currentTab = 'card';
let filterMode = null; // null | true | false
let levelFilter = null; // null | 'A1' | 'A2' | 'B1' | 'B2' | 'C1'
let searchQuery = '';
let isSpeaking = false;

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  applyFilters();
  renderCard();
  updateProgress();
}

function applyFilters() {
  let words = allWords;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    words = words.filter(w =>
      w.word.toLowerCase().includes(q) ||
      w.def.toLowerCase().includes(q) ||
      w.synonyms.some(s => s.toLowerCase().includes(q))
    );
  }
  if (levelFilter) words = words.filter(w => w.level === levelFilter);
  if (filterMode === true) words = words.filter(w => learnedSet.has(w.word));
  if (filterMode === false) words = words.filter(w => !learnedSet.has(w.word));
  filteredWords = words;
  currentIndex = Math.min(currentIndex, Math.max(0, filteredWords.length - 1));
  if (currentTab === 'card') renderCard();
  else renderList();
}

// ─────────────────────────────────────────────
// CARD RENDER
// ─────────────────────────────────────────────
function renderCard() {
  if (filteredWords.length === 0) {
    document.getElementById('cardCounter').textContent = '沒有符合的單字';
    document.getElementById('cardWord').textContent = '—';
    document.getElementById('cardPos').textContent = '';
    document.getElementById('cardLevel').textContent = '';
    document.getElementById('cardPhonetic').textContent = '';
    document.getElementById('cardDef').textContent = '';
    document.getElementById('cardExample').innerHTML = '';
    document.getElementById('cardExampleWrap').style.display = 'none';
    updateLearnedBtn();
    return;
  }

  const w = filteredWords[currentIndex];
  document.getElementById('cardCounter').textContent = `${currentIndex + 1} / ${filteredWords.length}`;
  document.getElementById('cardWord').textContent = w.word;
  document.getElementById('cardPos').textContent = w.pos;
  document.getElementById('cardLevel').textContent = w.level || '';
  document.getElementById('cardPhonetic').textContent = w.phonetic;
  document.getElementById('cardDef').textContent = w.def;
  if (w.example) {
    document.getElementById('cardExample').innerHTML = w.example;
    document.getElementById('cardExampleWrap').style.display = 'block';
  } else {
    document.getElementById('cardExampleWrap').style.display = 'none';
  }
  updateLearnedBtn();
}

function flipCard() { /* single card mode, no flip needed */ }

function prevCard() {
  currentIndex = (currentIndex - 1 + filteredWords.length) % filteredWords.length;
  renderCard();
}

function nextCard() {
  currentIndex = (currentIndex + 1) % filteredWords.length;
  renderCard();
}

function shuffleCards() {
  for (let i = filteredWords.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredWords[i], filteredWords[j]] = [filteredWords[j], filteredWords[i]];
  }
  currentIndex = 0;
  renderCard();
  showToast('已隨機排列！');
}

function toggleLearned() {
  if (filteredWords.length === 0) return;
  const word = filteredWords[currentIndex].word;
  if (learnedSet.has(word)) {
    learnedSet.delete(word);
    showToast(`取消標記：${word}`);
  } else {
    learnedSet.add(word);
    showToast(`已學會：${word} ✓`);
  }
  localStorage.setItem('learnedWords', JSON.stringify([...learnedSet]));
  updateLearnedBtn();
  updateProgress();
  if (filterMode !== null) applyFilters();
  if (filterMode === null && currentTab === 'list') renderList();
}

function updateLearnedBtn() {
  const btn = document.getElementById('btnLearned');
  const icon = document.getElementById('learnedIcon');
  const label = document.getElementById('learnedLabel');
  if (filteredWords.length === 0) return;
  const isLearned = learnedSet.has(filteredWords[currentIndex]?.word);
  btn.className = 'btn-ctrl' + (isLearned ? ' learned' : '');
  icon.textContent = isLearned ? '✓' : '★';
  label.textContent = isLearned ? '已學會' : '標記學會';
}

// ─────────────────────────────────────────────
// LIST RENDER
// ─────────────────────────────────────────────
function renderList() {
  const container = document.getElementById('view-list');
  if (filteredWords.length === 0) {
    container.innerHTML = '<div class="empty">沒有符合的單字</div>';
    return;
  }
  container.innerHTML = filteredWords.map((w, i) => {
    const learned = learnedSet.has(w.word);
    return `
      <div class="list-item ${learned ? 'learned-item' : ''}" onclick="goToCard(${i})">
        <div class="list-top">
          <div>
            <span class="list-word">${w.word}</span>
            <span class="list-pos-badge" style="margin-left:8px">${w.pos}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${learned ? '<div class="list-learned-dot"></div>' : ''}
            <button class="list-speak" onclick="speakWord(event,'${w.word}')" title="朗讀">🔊</button>
          </div>
        </div>
        <div class="list-phonetic">${w.phonetic}</div>
        <div class="list-def">${w.def}</div>
        <div class="list-syns">${w.synonyms.slice(0,4).map(s=>`<span class="syn-tag">${s}</span>`).join('')}</div>
      </div>
    `;
  }).join('');
}

function goToCard(index) {
  currentIndex = index;
  switchTab('card');
}

// ─────────────────────────────────────────────
// TABS & FILTERS
// ─────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'card') || (i === 1 && tab === 'list'));
  });
  document.getElementById('view-card').style.display = tab === 'card' ? 'flex' : 'none';
  document.getElementById('view-list').style.display = tab === 'list' ? 'block' : 'none';
  if (tab === 'card') renderCard();
  else renderList();
}

function filterLevel(lv) {
  levelFilter = (levelFilter === lv) ? null : lv;
  document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
  if (levelFilter) {
    const el = document.getElementById('lv' + (levelFilter || 'All'));
    if (el) el.classList.add('active');
  } else {
    document.getElementById('lvAll').classList.add('active');
  }
  currentIndex = 0;
  applyFilters();
}

function filterLearned(show) {
  filterMode = filterMode === show ? null : show;
  document.querySelectorAll('.tab').forEach((t, i) => {
    if (i === 2) t.classList.toggle('active', filterMode === false);
    if (i === 3) t.classList.toggle('active', filterMode === true);
  });
  currentIndex = 0;
  applyFilters();
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim();
  currentIndex = 0;
  applyFilters();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  applyFilters();
}

function searchSynonym(syn) {
  document.getElementById('searchInput').value = syn;
  searchQuery = syn;
  currentIndex = 0;
  switchTab('list');
  applyFilters();
}

// ─────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────
function updateProgress() {
  const total = allWords.length;
  const learned = learnedSet.size;
  const pct = total > 0 ? (learned / total) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${learned} / ${total} 已學會`;
}

// ─────────────────────────────────────────────
// TTS
// ─────────────────────────────────────────────
function speakCurrent(e) {
  e.stopPropagation();
  if (filteredWords.length === 0) return;
  speakWord(e, filteredWords[currentIndex].word);
}

function speakWord(e, word) {
  e.stopPropagation();
  if (!window.speechSynthesis) { showToast('您的瀏覽器不支援語音功能'); return; }
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  utt.pitch = 1;

  // pick a good English voice
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('samantha'))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
  if (enVoice) utt.voice = enVoice;

  const btn = e.currentTarget;
  btn.classList.add('speaking');
  utt.onend = () => btn.classList.remove('speaking');
  utt.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(utt);
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─────────────────────────────────────────────
// KEYBOARD
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (currentTab !== 'card') return;
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  else if (e.key === 'Enter') toggleLearned();
  else if (e.key === 's' || e.key === 'S') {
    speakWord({ stopPropagation: ()=>{}, currentTarget: document.getElementById('btnSpeakFront') },
      filteredWords[currentIndex]?.word || '');
  }
});

// wait for voices to load
window.speechSynthesis?.addEventListener('voiceschanged', () => {});

init();
</script>
